[project]
name = "doc2skill-api"
version = "1.0.0"
description = "Web API for Skill Seekers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.5",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "beautifulsoup4>=4.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
